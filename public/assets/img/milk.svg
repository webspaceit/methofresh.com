<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f0fdf4" rx="20"/>
  <defs>
    <linearGradient id="mlb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="mlcap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="200" cy="348" rx="72" ry="14" fill="#00000015"/>
  <!-- Carton body -->
  <rect x="128" y="150" width="144" height="192" rx="8" fill="url(#mlb)" stroke="#6ee7b7" stroke-width="3"/>
  <!-- Carton top left flap -->
  <polygon points="128,150 200,108 200,150" fill="#99f6e4" stroke="#6ee7b7" stroke-width="2"/>
  <!-- Carton top right flap -->
  <polygon points="272,150 200,108 200,150" fill="#a7f3d0" stroke="#6ee7b7" stroke-width="2"/>
  <!-- Red cap -->
  <rect x="180" y="88" width="40" height="24" rx="8" fill="url(#mlcap)"/>
  <!-- White label -->
  <rect x="138" y="175" width="124" height="118" rx="6" fill="white" opacity="0.72"/>
  <!-- Milk drop -->
  <path d="M200 198 Q210 214 210 224 Q210 238 200 242 Q190 238 190 224 Q190 214 200 198 Z" fill="#60a5fa"/>
  <!-- Label lines -->
  <rect x="148" y="252" width="104" height="8" rx="4" fill="#6ee7b7" opacity="0.7"/>
  <rect x="158" y="268" width="84" height="7" rx="3.5" fill="#a7f3d0" opacity="0.6"/>
  <rect x="165" y="282" width="70" height="7" rx="3.5" fill="#a7f3d0" opacity="0.5"/>
  <!-- Shine -->
  <rect x="132" y="158" width="14" height="112" rx="7" fill="white" opacity="0.2"/>
</svg>
